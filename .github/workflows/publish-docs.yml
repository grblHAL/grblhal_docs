name: Build and publish documentation

on:
  push:
    branches: [main]
    paths:
      - content/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/publish-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install generator dependencies
        run: npm ci

      - name: Build HTML
        run: npm run build

      - name: Publish to grblHAL.org
        env:
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp
          lftp -u io-engineering,"$SFTP_PASSWORD" sftp://sftp.domeneshop.no:22 -e "set sftp:auto-confirm yes; mkdir -p /www/gblHAL/docs; mirror --reverse --verbose ./docs/ /www/gblHAL/docs/; bye"
